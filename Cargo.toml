[package]
name = "gearcraft"
version = "0.1.0"
edition = "2024"
description = "Gear and gear-train designer"
license = "MIT"
repository = "https://github.com/RB211/GearCraft"

[dependencies]
crc32fast = "1.5"
eframe = "0.36.2"
flate2 = "1.1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

# The rack-generation simulation is arithmetic-heavy and reruns on every
# parameter edit, so even debug builds get optimised code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot", "eframe"] }
