[package]
name = "gearcraft"
version = "0.1.0"
edition = "2024"
description = "Gear and gear-train designer"

[dependencies]
eframe = "0.36.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

# The rack-generation simulation is arithmetic-heavy and reruns on every
# parameter edit, so even debug builds get optimised code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
